spring.application.name=project-service
platform.events.enabled=${PLATFORM_EVENTS_ENABLED:false}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=5000
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
logging.structured.format.console=ecs
platform.mode=${PLATFORM_MODE:prod}
platform.jobs.enabled=${PLATFORM_JOBS_ENABLED:true}
platform.identity.internal-url=${KEYCLOAK_INTERNAL_URL:http://keycloak:8080/auth}
platform.identity.public-url=${KEYCLOAK_PUBLIC_URL}
platform.identity.secret=${KEYCLOAK_PROVISIONER_SECRET}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_PUBLIC_URL}/realms/platform-admin-${PLATFORM_MODE:prod}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_INTERNAL_URL:http://keycloak:8080/auth}/realms/platform-admin-${PLATFORM_MODE:prod}/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=platform-admin-api
