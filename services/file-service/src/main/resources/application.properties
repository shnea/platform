spring.application.name=file-service
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=5000
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
logging.structured.format.console=ecs
platform.files.environment-quota=${FILE_ENVIRONMENT_QUOTA:50000000000}
platform.files.pending-limit=${FILE_PENDING_LIMIT:20}
spring.servlet.multipart.enabled=false
server.tomcat.threads.max=16
server.tomcat.connection-timeout=30s
