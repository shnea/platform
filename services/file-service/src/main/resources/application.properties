spring.application.name=file-service
spring.task.scheduling.pool.size=4
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=5000
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
logging.structured.format.console=ecs
platform.files.environment-quota=${FILE_ENVIRONMENT_QUOTA:50000000000}
platform.files.pending-limit=${FILE_PENDING_LIMIT:20}
platform.files.processing-backend=${FILE_PROCESSING_BACKEND:noedaeri}
platform.noedaeri.url=${NOEDAERI_BASE_URL:}
platform.noedaeri.api-key=${NOEDAERI_PLATFORM_API_KEY:}
platform.noedaeri.webhook-secret=${NOEDAERI_PLATFORM_WEBHOOK_SECRET:}
platform.noedaeri.video-input-limit=${NOEDAERI_VIDEO_INPUT_LIMIT:536870912}
spring.servlet.multipart.enabled=false
server.tomcat.threads.max=16
server.tomcat.connection-timeout=30s
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_PUBLIC_URL}/realms/platform-admin-${PLATFORM_MODE:prod}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_INTERNAL_URL:http://keycloak:8080/auth}/realms/platform-admin-${PLATFORM_MODE:prod}/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=platform-admin-api
