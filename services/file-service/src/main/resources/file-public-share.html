<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} · SHNEA</title><link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="website"><meta property="og:site_name" content="SHNEA Platform">
<meta property="og:title" content="{{title}}"><meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}"><meta property="og:image" content="{{image}}">
<style>
:root{color-scheme:dark light;--bg:#111918;--surface:#182220;--text:#e8eee8;--muted:#a5b7ae;--line:#34443e;--accent:#b0e1c7;--ink:#123b2c}
@media(prefers-color-scheme:light){:root{--bg:#f5f6f1;--surface:#fff;--text:#183126;--muted:#52695c;--line:#cdd7ce;--accent:#245c43;--ink:#fff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 "Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
main{max-width:680px;margin:8vh auto;padding:32px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.brand,.hint{color:var(--muted);font-size:14px}h1{font-size:32px;line-height:1.3;letter-spacing:-.035em;overflow-wrap:anywhere}p{overflow-wrap:anywhere}
.preview{display:block;width:100%;max-height:360px;object-fit:contain;margin:24px 0}nav{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}
a{padding:12px 20px;border-radius:6px;background:var(--accent);color:var(--ink);text-decoration:none;font-weight:600;min-height:48px}a.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}a:hover{text-decoration:underline}
h1{word-break:keep-all;text-wrap:balance}p{word-break:keep-all}
@media(max-width:720px){main{margin:24px 16px;padding:24px}nav a{flex:1;text-align:center}}
</style></head><body><main><p class="brand">SHNEA Platform · 파일 공유</p><h1>{{title}}</h1><p>{{description}}</p>{{picture}}
<nav aria-label="파일 열기"><a href="{{viewer}}">파일 보기</a><a class="secondary" href="{{download}}">다운로드</a></nav>
<p class="hint">공개된 파일입니다. 파일이 비공개로 바뀌거나 삭제되면 이 링크로 열 수 없습니다.</p></main></body></html>
