:root{color-scheme:dark;--bg:#111918;--surface:#182220;--text:#e8eee8;--muted:#a5b7ae;--line:#34443e;--accent:#b0e1c7;--ink:#123b2c;--danger:#ffada5}
@media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#f5f6f1;--surface:#fff;--text:#183126;--muted:#52695c;--line:#cdd7ce;--accent:#245c43;--ink:#fff;--danger:#a32b24}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 "Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;overflow-wrap:anywhere}
main{max-width:480px;margin:clamp(40px,12vh,120px) auto;padding:24px}h1{font-size:32px;line-height:1.4;letter-spacing:-.035em;margin:0 0 16px;text-wrap:balance}p{margin:0 0 24px;color:var(--muted)}form{margin-top:32px}label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}input{width:100%;min-height:48px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:10px 12px;font:inherit;caret-color:var(--accent)}button{width:100%;min-height:48px;background:var(--accent);color:var(--ink);border:0;border-radius:6px;font:inherit;font-weight:700;cursor:pointer}button:hover{filter:brightness(.92)}input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.hint{font-size:14px;margin:8px 0 24px}.foot{border-top:1px solid var(--line);padding-top:24px;margin-top:32px}.error{color:var(--danger);border:1px solid var(--danger);padding:12px;border-radius:6px}::selection{background:var(--accent);color:var(--ink)}
button{display:inline-flex;align-items:center;justify-content:center;gap:8px}button svg{flex:none}
</style>
