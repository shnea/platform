# Standalone disposable database; never combine with compose.yml or mount runtime data.
name: platform-job-checks
services:
  job-test-db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: job_checks
      POSTGRES_USER: job_checks
      POSTGRES_PASSWORD: isolated-test-only
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U job_checks -d job_checks]
      interval: 1s
      timeout: 3s
      retries: 30
  check:
    image: gradle:9.7.1-jdk21
    depends_on:
      job-test-db: {condition: service_healthy}
    environment:
      JOB_TEST_DB_URL: jdbc:postgresql://job-test-db:5432/job_checks
    volumes:
      - ./services:/source/services:ro
      - ./libraries:/source/libraries:ro
      - ./settings.gradle.kts:/source/settings.gradle.kts:ro
      - ./build.gradle.kts:/source/build.gradle.kts:ro
      - ./gradle.properties:/source/gradle.properties:ro
      - ./scripts/check-jobs-db.sh:/check.sh:ro
      - ./output/job-checks:/reports
      - gradle-cache:/home/gradle/.gradle
    entrypoint: [sh, /check.sh]
volumes:
  gradle-cache:
