# The configured public URL determines the TLS scheme; never trust caller forwarding headers.
map "${KEYCLOAK_PUBLIC_URL}" $platform_forwarded_proto {
    default http;
    "~^https://" https;
}

# Only this immediate proxy may supply the client IP. Keep 30140 private to it.
# NPM appends its observed client to X-Forwarded-For; ignore earlier caller entries.
set_real_ip_from ${NGINX_TRUSTED_PROXY};
real_ip_header X-Forwarded-For;
real_ip_recursive off;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 1m;
    # Query strings can contain authorization codes or future sharing secrets.
    access_log off;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"UP","service":"gateway"}';
    }
    location = /api/projects/health {
        set $upstream project-service:8080;
        proxy_pass http://$upstream/actuator/health/readiness;
    }
    location = /api/files/health {
        set $upstream file-service:8080;
        proxy_pass http://$upstream/actuator/health/readiness;
    }
    location = /api/notifications/health {
        set $upstream notification-service:8080;
        proxy_pass http://$upstream/actuator/health/readiness;
    }
    location ~ ^/auth/social/(naver|kakao|google)/callback$ {
        set $identity keycloak:8080;
        rewrite ^/auth/social/(naver|kakao|google)/callback$ /auth/realms/master/platform-social/$1/callback break;
        proxy_pass http://$identity;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $platform_forwarded_proto;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
    }
    # Only project-service reads credential readiness through the internal Keycloak URL.
    location ~ ^/auth/realms/[^/]+/platform-social/configuration/?$ { return 404; }
    location /auth/ {
        set $identity keycloak:8080;
        proxy_pass http://$identity;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $platform_forwarded_proto;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
    }
    location /api/v1/ {
        set $projects project-service:8080;
        proxy_pass http://$projects;
        proxy_set_header Host $http_host;
        # A public caller cannot choose the platform correlation ID.
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $request_id always;
    }
    location = / {
        set $web admin-web:8080;
        proxy_pass http://$web;
    }
    location /assets/ {
        set $web admin-web:8080;
        proxy_pass http://$web;
    }
    location / { return 404; }
}
