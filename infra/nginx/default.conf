# The configured public URL determines the TLS scheme; never trust caller forwarding headers.
map "${KEYCLOAK_PUBLIC_URL}" $platform_forwarded_proto {
    default http;
    "~^https://" https;
}

# Only this immediate proxy may supply the client IP. Keep 30140 private to it.
# NPM appends its observed client to X-Forwarded-For; ignore earlier caller entries.
set_real_ip_from ${NGINX_TRUSTED_PROXY};
real_ip_header X-Forwarded-For;
real_ip_recursive off;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 1m;
    # Query strings can contain authorization codes or future sharing secrets.
    access_log off;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"UP","service":"gateway"}';
    }
    location = /api/projects/health {
        set $upstream project-service:8080;
        proxy_pass http://$upstream/actuator/health/readiness;
    }
    location = /api/files/health {
        set $upstream file-service:8080;
        proxy_pass http://$upstream/actuator/health/readiness;
    }
    location = /api/notifications/health {
        set $upstream notification-service:8080;
        proxy_pass http://$upstream/actuator/health/readiness;
    }
    location ~ ^/auth/social/(naver|kakao|google)/callback$ {
        set $identity keycloak:8080;
        rewrite ^/auth/social/(naver|kakao|google)/callback$ /auth/realms/master/platform-social/$1/callback break;
        proxy_pass http://$identity;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $platform_forwarded_proto;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
    }
    # Only project-service reads credential readiness through the internal Keycloak URL.
    location ~ ^/auth/realms/[^/]+/platform-social/configuration/?$ { return 404; }
    location /auth/ {
        set $identity keycloak:8080;
        proxy_pass http://$identity;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $platform_forwarded_proto;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
    }
    location ~ ^/api/v1/files(?:/|$) {
        error_log /dev/stderr crit;
        client_max_body_size 8m;
        client_body_timeout 30s;
        proxy_read_timeout 300s;
        error_page 413 = @api_too_large;
        error_page 502 = @api_bad_gateway;
        error_page 503 = @api_unavailable;
        error_page 504 = @api_timeout;
        proxy_intercept_errors off;
        set $files file-service:8080;
        proxy_pass http://$files;
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $request_id always;
        # Bounded chunks are buffered before handing them to a DB-backed upload operation.
        proxy_request_buffering on;
        proxy_buffering off;
    }
    location /api/v1/ {
        # Prevent upstream failure logs from echoing a request's query secrets.
        error_log /dev/stderr crit;
        error_page 413 = @api_too_large;
        error_page 502 = @api_bad_gateway;
        error_page 503 = @api_unavailable;
        error_page 504 = @api_timeout;
        # Keep application problem bodies; only locally generated proxy errors use the pages above.
        proxy_intercept_errors off;
        set $projects project-service:8080;
        proxy_pass http://$projects;
        proxy_set_header Host $http_host;
        # A public caller cannot choose the platform correlation ID.
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $request_id always;
    }
    location @api_too_large {
        default_type application/problem+json;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control no-store always;
        add_header Content-Language ko always;
        return 413 '{"type":"urn:shnea:platform:error:PAYLOAD_TOO_LARGE","title":"요청 오류","status":413,"detail":"요청 크기가 허용 범위를 초과했습니다.","instance":"urn:shnea:platform:request:$request_id","code":"PAYLOAD_TOO_LARGE","requestId":"$request_id"}';
    }
    location @api_bad_gateway {
        default_type application/problem+json;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control no-store always;
        add_header Content-Language ko always;
        return 502 '{"type":"urn:shnea:platform:error:UPSTREAM_UNAVAILABLE","title":"서비스 처리 오류","status":502,"detail":"연결된 서비스의 처리를 확인하지 못했습니다. 현재 상태를 먼저 확인해 주세요.","instance":"urn:shnea:platform:request:$request_id","code":"UPSTREAM_UNAVAILABLE","requestId":"$request_id"}';
    }
    location @api_unavailable {
        default_type application/problem+json;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control no-store always;
        add_header Content-Language ko always;
        return 503 '{"type":"urn:shnea:platform:error:SERVICE_UNAVAILABLE","title":"서비스 처리 오류","status":503,"detail":"서비스를 일시적으로 사용할 수 없습니다. 잠시 후 상태를 확인해 주세요.","instance":"urn:shnea:platform:request:$request_id","code":"SERVICE_UNAVAILABLE","requestId":"$request_id"}';
    }
    location @api_timeout {
        default_type application/problem+json;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control no-store always;
        add_header Content-Language ko always;
        return 504 '{"type":"urn:shnea:platform:error:UPSTREAM_TIMEOUT","title":"서비스 처리 오류","status":504,"detail":"연결된 서비스의 응답 시간이 초과되었습니다. 현재 상태를 먼저 확인해 주세요.","instance":"urn:shnea:platform:request:$request_id","code":"UPSTREAM_TIMEOUT","requestId":"$request_id"}';
    }
    location = / {
        set $web admin-web:8080;
        proxy_pass http://$web;
    }
    location /assets/ {
        set $web admin-web:8080;
        proxy_pass http://$web;
    }
    location = /file-viewer.html {
        set $web admin-web:8080;
        proxy_pass http://$web;
    }
    location = /examples/file-client.py {
        set $web admin-web:8080;
        proxy_pass http://$web;
    }
    location / { return 404; }
}
