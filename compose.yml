name: ${COMPOSE_PROJECT_NAME:-shnea-platform}

x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  stop_grace_period: 30s

x-api: &api
  <<: *runtime
  networks: [app, database]
  depends_on:
    db: {condition: service_healthy}
  healthcheck:
    test: [CMD, curl, -fsS, --max-time, "4", "http://localhost:8080/actuator/health/readiness"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 60s

services:
  storage-init:
    image: ${REGISTRY_HOST:-registry.shnea.kr}/platform-tools:${IMAGE_TAG:?Use scripts/dev.ps1 or scripts/deploy.sh}
    user: "0:0"
    restart: "no"
    network_mode: none
    read_only: true
    mem_limit: 64m
    entrypoint: [python, /tools/prepare-storage.py]
    volumes:
      - ${PLATFORM_DATA_ROOT:-./data}:/data

  identity-setup:
    restart: "no"
    depends_on:
      keycloak: {condition: service_healthy}
    image: ${REGISTRY_HOST:-registry.shnea.kr}/platform-tools:${IMAGE_TAG:?Set IMAGE_TAG}
    networks: [app]
    mem_limit: 128m
    environment:
      PLATFORM_MODE: ${PLATFORM_MODE:-prod}
      PLATFORM_WEB_URL: ${PLATFORM_WEB_URL:-http://localhost:30140}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Load encrypted environment with the scripts}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?Load encrypted environment with the scripts}
      KEYCLOAK_PROVISIONER_SECRET: ${KEYCLOAK_PROVISIONER_SECRET:?Load encrypted environment with the scripts}

  admin-web:
    <<: *runtime
    image: ${REGISTRY_HOST:-registry.shnea.kr}/platform-admin-web:${IMAGE_TAG:?Set IMAGE_TAG}
    networks: [app]
    mem_limit: ${ADMIN_WEB_MEMORY:-64m}
    cpus: ${ADMIN_WEB_CPUS:-0.5}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 5s
      retries: 12

  db:
    <<: *runtime
    image: ${REGISTRY_HOST:-registry.shnea.kr}/platform-postgres:${IMAGE_TAG:?Set IMAGE_TAG}
    mem_limit: ${DB_MEMORY:-512m}
    cpus: ${DB_CPUS:-1.0}
    networks: [database]
    environment:
      POSTGRES_USER: platform_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Load encrypted environment with the scripts}
      PROJECT_DB_PASSWORD: ${PROJECT_DB_PASSWORD:?Load encrypted environment with the scripts}
      FILE_DB_PASSWORD: ${FILE_DB_PASSWORD:?Load encrypted environment with the scripts}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Load encrypted environment with the scripts}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Load encrypted environment with the scripts}
    volumes:
      - ${PLATFORM_DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data
    depends_on:
      storage-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  keycloak:
    <<: *runtime
    image: ${REGISTRY_HOST:-registry.shnea.kr}/platform-keycloak:${IMAGE_TAG:?Set IMAGE_TAG}
    command: [start, --optimized]
    mem_limit: ${KEYCLOAK_MEMORY:-1024m}
    cpus: ${KEYCLOAK_CPUS:-2.0}
    networks: [app, database]
    depends_on:
      db: {condition: service_healthy}
    environment:
      KC_DB: postgres
      PLATFORM_MAIL_SECRET: ${PLATFORM_MAIL_SECRET:?Load encrypted environment with the scripts}
      PLATFORM_MODE: ${PLATFORM_MODE:-prod}
      SOCIAL_NAVER_CLIENT_ID: ${SOCIAL_NAVER_CLIENT_ID:-}
      SOCIAL_NAVER_CLIENT_SECRET: ${SOCIAL_NAVER_CLIENT_SECRET:-}
      SOCIAL_GOOGLE_CLIENT_ID: ${SOCIAL_GOOGLE_CLIENT_ID:-}
      SOCIAL_GOOGLE_CLIENT_SECRET: ${SOCIAL_GOOGLE_CLIENT_SECRET:-}
      SOCIAL_KAKAO_CLIENT_ID: ${SOCIAL_KAKAO_CLIENT_ID:-}
      SOCIAL_KAKAO_CLIENT_SECRET: ${SOCIAL_KAKAO_CLIENT_SECRET:-}
      KC_DB_URL: jdbc:postgresql://db:5432/platform_identity
      KC_DB_USERNAME: platform_identity
      KC_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Load encrypted environment with the scripts}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Load encrypted environment with the scripts}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_PROXY_HEADERS: xforwarded
      KC_DB_POOL_INITIAL_SIZE: "1"
      KC_DB_POOL_MIN_SIZE: "1"
      KC_DB_POOL_MAX_SIZE: "5"
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=60
    healthcheck:
      test: [CMD, bash, -ec, "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  project-service:
    <<: *api
    depends_on:
      db: {condition: service_healthy}
      identity-setup: {condition: service_completed_successfully}
    networks: [app, database, logs]
    image: ${REGISTRY_HOST:-registry.shnea.kr}/platform-project-service:${IMAGE_TAG:?Set IMAGE_TAG}
    mem_limit: ${PROJECT_MEMORY:-512m}
    cpus: ${PROJECT_CPUS:-1.0}
    environment:
      DB_URL: jdbc:postgresql://db:5432/platform_project
      PLATFORM_FILES_SECRET: ${PLATFORM_FILES_SECRET:-}
      PLATFORM_MONITORING_SECRET: ${PLATFORM_MONITORING_SECRET:-}
      PLATFORM_JOBS_ENABLED: ${PLATFORM_JOBS_ENABLED:-true}
      PLATFORM_LOGS_URL: http://loki:3100
      PLATFORM_EVENTS_ENABLED: ${PLATFORM_EVENTS_ENABLED:-false}
      PLATFORM_EVENTS_SECRET: ${PLATFORM_EVENTS_SECRET:-}
      PLATFORM_MAIL_SECRET: ${PLATFORM_MAIL_SECRET:?Load encrypted environment with the scripts}
      DB_USERNAME: platform_project
      DB_PASSWORD: ${PROJECT_DB_PASSWORD:?Load encrypted environment with the scripts}
      PLATFORM_MODE: ${PLATFORM_MODE:-prod}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_PROVISIONER_SECRET: ${KEYCLOAK_PROVISIONER_SECRET:?Load encrypted environment with the scripts}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError}

  loki:
    <<: *runtime
    image: grafana/loki:3.7.0
    command: [-config.file=/etc/loki/platform.yml]
    networks: [logs]
    mem_limit: ${LOKI_MEMORY:-512m}
    cpus: ${LOKI_CPUS:-1.0}
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/platform.yml:ro
      - ${PLATFORM_DATA_ROOT:-./data}/loki:/loki
    depends_on:
      storage-init: {condition: service_completed_successfully}

  file-service:
    <<: *api
    image: ${REGISTRY_HOST:-registry.shnea.kr}/platform-file-service:${IMAGE_TAG:?Set IMAGE_TAG}
    mem_limit: ${FILE_MEMORY:-1g}
    cpus: ${FILE_CPUS:-1.0}
    volumes:
      - ${PLATFORM_DATA_ROOT:-./data}/files:/app/storage
    depends_on:
      db: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    environment:
      DB_URL: jdbc:postgresql://db:5432/platform_file
      PLATFORM_MODE: ${PLATFORM_MODE:-prod}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL}
      PLATFORM_FILES_SECRET: ${PLATFORM_FILES_SECRET:-}
      FILE_ENVIRONMENT_QUOTA: ${FILE_ENVIRONMENT_QUOTA:-50000000000}
      FILE_PENDING_LIMIT: ${FILE_PENDING_LIMIT:-20}
      FILE_PROCESSING_BACKEND: ${FILE_PROCESSING_BACKEND:-noedaeri}
      NOEDAERI_BASE_URL: ${NOEDAERI_BASE_URL:-}
      NOEDAERI_PLATFORM_API_KEY: ${NOEDAERI_PLATFORM_API_KEY:-}
      NOEDAERI_PLATFORM_WEBHOOK_SECRET: ${NOEDAERI_PLATFORM_WEBHOOK_SECRET:-}
      NOEDAERI_VIDEO_INPUT_LIMIT: ${NOEDAERI_VIDEO_INPUT_LIMIT:-536870912}
      PLATFORM_MONITORING_SECRET: ${PLATFORM_MONITORING_SECRET:-}
      DB_USERNAME: platform_file
      DB_PASSWORD: ${FILE_DB_PASSWORD:?Load encrypted environment with the scripts}
      JAVA_TOOL_OPTIONS: ${FILE_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=35 -XX:+ExitOnOutOfMemoryError}

  notification-service:
    <<: *api
    image: ${REGISTRY_HOST:-registry.shnea.kr}/platform-notification-service:${IMAGE_TAG:?Set IMAGE_TAG}
    mem_limit: ${NOTIFICATION_MEMORY:-512m}
    cpus: ${NOTIFICATION_CPUS:-1.0}
    environment:
      DB_URL: jdbc:postgresql://db:5432/platform_notification
      PLATFORM_MONITORING_SECRET: ${PLATFORM_MONITORING_SECRET:-}
      PLATFORM_EVENTS_SECRET: ${PLATFORM_EVENTS_SECRET:-}
      PLATFORM_MAIL_SECRET: ${PLATFORM_MAIL_SECRET:?Load encrypted environment with the scripts}
      DB_USERNAME: platform_notification
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Load encrypted environment with the scripts}
      PLATFORM_MODE: ${PLATFORM_MODE:-prod}
      NCP_ACCESS_KEY: ${NCP_ACCESS_KEY:-}
      NCP_SECRET_KEY: ${NCP_SECRET_KEY:-}
      NCP_SMS_SERVICE_ID: ${NCP_SMS_SERVICE_ID:-}
      NCP_BIZ_MESSAGE_SERVICE_ID: ${NCP_BIZ_MESSAGE_SERVICE_ID:-}
      NCP_MAIL_API_ENDPOINT: ${NCP_MAIL_API_ENDPOINT:-https://mail.apigw.ntruss.com}
      NCP_MAIL_API_PATH: ${NCP_MAIL_API_PATH:-/api/v1/mails}
      NCP_MAIL_SENDER_ADDRESS: ${NCP_MAIL_SENDER_ADDRESS:-}
      NCP_MAIL_SENDER_NAME: ${NCP_MAIL_SENDER_NAME:-SHNEA}
      NCP_SMS_SENDER_NUMBER: ${NCP_SMS_SENDER_NUMBER:-}
      NCP_KAKAO_CHANNEL_ID: ${NCP_KAKAO_CHANNEL_ID:-}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError}

  nginx:
    <<: *runtime
    image: ${REGISTRY_HOST:-registry.shnea.kr}/platform-nginx:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL}
      NGINX_TRUSTED_PROXY: ${NGINX_TRUSTED_PROXY:-127.0.0.1}
      NGINX_ENVSUBST_FILTER: ^(KEYCLOAK_PUBLIC_URL|NGINX_TRUSTED_PROXY)$
    mem_limit: ${NGINX_MEMORY:-64m}
    cpus: ${NGINX_CPUS:-0.5}
    networks: [app]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-30140}:8080"
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  logs:
    internal: true
    ipam:
      config:
        - subnet: ${LOGS_SUBNET:-10.250.12.0/24}
  app:
    ipam:
      config:
        - subnet: ${APP_SUBNET:-10.250.10.0/24}
  database:
    internal: true
    ipam:
      config:
        - subnet: ${DATABASE_SUBNET:-10.250.11.0/24}
