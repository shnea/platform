server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /file-viewer.html {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; media-src 'self' blob:; img-src 'self' data:; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
    }
    location /assets/ { try_files $uri =404; }
    location / { return 404; }
}
