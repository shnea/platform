server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /demo.html {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob:; img-src 'self' data:; frame-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }
    location = /assets/demo/sample.txt {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location = /file-viewer.html {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; media-src 'self' blob:; img-src 'self' data:; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
    }
    location /assets/ { try_files $uri =404; }
    location /integrations/ {
        types { application/gzip tgz; application/json json; text/plain md; }
        default_type application/octet-stream;
        charset utf-8;
        try_files $uri =404;
    }
    location /examples/editor/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }
    location = /examples/file-client.py {
        default_type text/plain;
        add_header Content-Disposition 'attachment; filename="file-client.py"';
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location / { return 404; }
}
